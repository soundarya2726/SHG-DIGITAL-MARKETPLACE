<!DOCTYPE html>
<html>
<head>
    <title>Add Product - SHG Digital Marketplace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #6a1b9a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a148c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #6a1b9a;
        }

        .message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>SHG Digital Marketplace</h1>
        <p>Add Your Product</p>
    </div>

    <div class="container">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="form-box">

            <h2>Add Product</h2>

            <form method="POST" action="/add-product" enctype="multipart/form-data">
                <label>Product Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter product name"
                    required
                >

                <label>Description</label>
                <textarea
                    name="description"
                    placeholder="Enter product description"
                    required
                ></textarea>

                <label>Price (₹)</label>
                <input
                    type="number"
                    name="price"
                    placeholder="Enter product price"
                    min="1"
                    step="0.01"
                    required
                >
                <label>Product Image</label>
                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

                <button type="submit">
                    Add Product
                </button>

            </form>

            <a href="/dashboard" class="back">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>
</html>
