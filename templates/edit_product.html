<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - SHG Digital Marketplace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #6a1b9a, #8e24aa);
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 550px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            background: #6a1b9a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #4a148c;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #6a1b9a;
        }

        .message {
            background: #ffe0e0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <header>
        <h1>SHG Digital Marketplace</h1>
        <p>Edit Your Product</p>
    </header>

    <div class="container">
        <h2>Update Product Details</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="name">Product Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ product[1] }}"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="4"
            >{{ product[2] }}</textarea>

            <label for="price">Price (₹)</label>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                value="{{ product[3] }}"
                required
            >

            <button type="submit">Save Changes</button>
        </form>

        <a class="back" href="/dashboard">← Back to Dashboard</a>
    </div>
</body>
</html>
